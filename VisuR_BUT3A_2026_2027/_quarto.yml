# Fichier à stocker à la racine du projet

project:
  type: default
  
abstract-title: "Résumé"

bibliography:
  main: Lyser_UTF8.bib
  packages: packagesR_2026.bib
  
citeproc: false

controls: false # afficher les flèches de navigation dans la présentation

controls-layout: edges # type d'affichage des flèches de navigation

crossref:
  fig-title: Figure
  tbl-title: Tableau
  title-delim: \. # pour ne pas avoir Tableau..
  fig-prefix: figure
  tbl-prefix: tableau
  sec-labels: section
  ref-hyperlink: true

csl: apa-single-spaced.csl # style de la biblio

date-format: "YYYY-MM-DD"

editor: source

editor_options:
  chunk_output_type: console
    
execute:
  echo: true
  eval: true
  warning: false
  message: false
  out.width: "100%"
  df_print: tibble
  cache: false
  results: asis

filters:
  - multibib

format:
  revealjs: # 1er type d'output pour pouvoir être compilé sur VSCode avec le bouton preview
    auto-stretch: true
    center: false  # centrer verticalement
    code-block-height: 800px  # hauteur maximale des blocs de code
    code-copy: true 
    css: style_html.css
    fig-cap-location: top
    fig-height: 5 # par défaut
    fig-width: 9 # par défaut
    height: 1080  # adaptée à la résolution de l'écran // 700 par défaut
    include-after-body: [toc-add.html, add-custom-footer.html]
    incremental: false
    margin: 0.075
    menu:
      useTextContentForMissingTitles: false
      hideMissingTitles: true
      width: normal # normal, wide, third, half, full = largeur du menu
    output-file: slides.html # nom du fichier de sortie
    scrollable: true
    show-slide-number: all
    slide-level: 3 # niveau de titre maxi des diapos
    slide-number: c # slide/total
    template-partials:
      - toc-slide.html
    theme: [simple, style_revealjs.scss]
    toc-depth: 2 # niveau de titres à afficher dans la toc
    toc-title: "Plan" # titre de la toc
    width: 1920   # adaptée à la résolution de l'écran // 1050 par défaut
  html:
    code-block-background: true
    code-block-border-left: true
    code-copy: true
    code-fold: true
    code-summary: "Afficher le code"
    css: style_html.css  
    embed-resources: true # pour avoir les images contenues dans le fihier html
    fig-height: 5 # par défaut
    fig-width: 7 # par défaut
    grid:
      sidebar-width: 300px   # largeur maximale de la colonne de gauche (sidebar - par défaut 250px)
      body-width: 900px      # largeur maximale de la colonne centrale (contenu principal - par défaut 800px)
      margin-width: 300px    # largeur maximale de la colonne de droite (table des matières, notes, etc. - par défaut 250px)
      gutter-width: 1.5rem   # espacement entre les colonnes (par défaut 1.5em)
    include-after-body: [toc-add.html, add-custom-footer.html]   
    page-layout: full
    theme:
      light: flatly
      dark: darkly
    toc-depth: 4
    toc-expand: true
  pdf:
    code-block-background: true
    code-block-border-left: true 
    colorlinks: true
    documentclass: article   
    fig-height: 2.5 # par défaut
    fig-width: 4.5 # par défaut
    fontsize: 10pt
    geometry:
      - top=20mm
      - left=20mm
      - right=20mm
      - bottom=20mm
    include-in-header:
      text: |
        % Retour à la ligne du texte pour qu'il ne dépasse pas dans les marges du document
        \usepackage{fvextra}
        \DefineVerbatimEnvironment{Highlighting}{Verbatim}{breaklines,breakanywhere,commandchars=\\\{\}}
        \renewenvironment{verbatim}{\VerbatimEnvironment\begin{Verbatim}[breaklines=true,breakanywhere=true]}{\end{Verbatim}}
        
        
        \usepackage{graphicx} % pour insérer des images
        \usepackage{fancyhdr} % gestion du header / footer
        \pagestyle{plain}     % style par défaut avec numéro de page centré en bas

        % STYLE « firstpage » : pied de page personnalisé pour la première page
        \fancypagestyle{firstpage}{
          % vide header et footer
          \fancyhf{} % 
          % --- suppression des lignes horizontales ---
          \renewcommand{\headrulewidth}{0pt} % supprime la ligne horizontale de l'en-tête
          \renewcommand{\footrulewidth}{0pt} % supprime la ligne horizontale du pied de page
          % --- ajustement local de la distance du bas = augmenter \footskip localement avec \setlength ---
          \setlength{\footskip}{1pt}
          %  --- contenu du pied de page centré ---
          \fancyfoot[C]{%
            Diffusé sous licence CC BY-NC-SA 4.0 \\[6pt] % texte avec saut de ligne vertical
            \includegraphics[height=1cm]{img/Licence_cc-by-nc-sa.png} \\[10pt] % logo en dessous puis ligne vide supplémentaire
            }
            }
    latex-engine: pdflatex #lualatex
    mainfont: "Raleway"
    monofont: "Consolas"
    monofontoptions: 
      - Scale=0.9
    number-sections: true
    output-file: VisuR.pdf # nom du fichier de sortie
    papersize: A4
    sansfont: "Avenir Next LT Pro"
    toc-depth: 3

format-links: [pdf, revealjs]

highlight-style: atom-one

lang: fr

license: CC BY-NC-SA

lightbox: true # pour avoir les images cliquables

link-external-icon: false # pour afficher une icône à côté du lien

link-external-newwindow: true # pour ouvrir les liens dans un nouvel onglet

prefer-html: true

toc: true

transition: none

validate-yaml: false
